name: sync

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Regression checks
        run: |
          python3 -m unittest discover -s tests -v
          node tests/test_app.mjs
          node --check docs/app.js
          node --check docs/sw.js

      - uses: actions/cache@v4
        with:
          path: docs/data
          key: timetable-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: timetable-

      # The data is not kept in git: what the site serves now is the last sync
      - name: Fetch the data the site serves now
        run: |
          mkdir -p docs/data
          if [ ! -f docs/data/index.json ]; then
            curl --connect-timeout 10 --max-time 30 -fsS "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/index.json" \
              -o docs/data/index.json || rm -f docs/data/index.json
          fi

      # Scheduled checks reuse unchanged data and refresh the check timestamp.
      # A source that parses badly fails here, and the site keeps its last good data.
      - name: Sync with rasp.bru.by
        shell: bash
        run: |
          python3 scripts/sync.py ${{ github.event_name != 'schedule' && '--force' || '' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
